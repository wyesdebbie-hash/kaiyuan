<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Lottery Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #87CEEB; /* Sky blue background */
            background-image: 
                radial-gradient(white 15%, transparent 16%),
                radial-gradient(white 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #333;
            overflow-x: hidden;
            user-select: none;
        }

        /* Pixel border mixin */
        .pixel-box {
            background-color: white;
            box-shadow: 
                -4px 0 0 0 black,
                4px 0 0 0 black,
                0 -4px 0 0 black,
                0 4px 0 0 black,
                -4px -4px 0 0 black,
                4px -4px 0 0 black,
                -4px 4px 0 0 black,
                4px 4px 0 0 black;
            margin: 8px;
            padding: 16px;
            position: relative;
        }

        .pixel-button {
            background-color: #fca5a5; /* Red base */
            color: white;
            text-shadow: 2px 2px 0px #b91c1c;
            border: none;
            box-shadow: 
                inset -4px -4px 0px 0px rgba(0,0,0,0.2),
                -4px 0 0 0 black,
                4px 0 0 0 black,
                0 -4px 0 0 black,
                0 4px 0 0 black,
                -4px -4px 0 0 black,
                4px -4px 0 0 black,
                -4px 4px 0 0 black,
                4px 4px 0 0 black;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .pixel-button:active {
            transform: translateY(4px);
            box-shadow: 
                inset -2px -2px 0px 0px rgba(0,0,0,0.2),
                -4px 0 0 0 black,
                4px 0 0 0 black,
                0 -4px 0 0 black,
                0 4px 0 0 black,
                -4px -4px 0 0 black,
                4px -4px 0 0 black,
                -4px 4px 0 0 black,
                4px 4px 0 0 black;
        }
        
        .pixel-button:disabled {
            background-color: #d1d5db;
            text-shadow: 2px 2px 0px #6b7280;
            cursor: not-allowed;
        }

        .pixel-input {
            font-family: 'Press Start 2P', cursive;
            background-color: #f3f4f6;
            border: 4px solid black;
            padding: 8px;
            font-size: 12px;
            outline: none;
            width: 100%;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bouncing {
            animation: bounce 1s infinite;
        }

        @keyframes slotMachine {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        #result-display {
            overflow: hidden;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fbbf24;
            color: black;
            font-size: 24px;
        }

        .slot-item {
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }
        
        .slot-item.active {
            opacity: 1;
        }

        .animating-slot .slot-item {
            animation: slotMachine 0.1s linear infinite;
        }

        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-left: 4px solid black;
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border: 2px solid black;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        /* Confetti effect (simple CSS approach) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
            z-index: 50;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }
        
        /* Modal for messages */
        #msg-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #msg-modal.active {
            display: flex;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 relative">

    <h1 class="text-3xl md:text-5xl text-center text-white mb-10 bouncing" style="text-shadow: 4px 4px 0px black;">
        <span class="text-pink-400">♥</span> PIXEL DRAW <span class="text-pink-400">♥</span>
    </h1>

    <div class="container mx-auto px-4 max-w-4xl flex flex-col md:flex-row gap-8">
        
        <!-- Left Panel: Setup and List -->
        <div class="w-full md:w-1/2 flex flex-col gap-6">
            
            <!-- Upload Box -->
            <div class="pixel-box">
                <h2 class="text-lg mb-4 text-center text-blue-600">1. LOAD EXCEL (.xlsx)</h2>
                <div class="flex flex-col gap-4">
                    <div class="relative w-full h-24 border-4 border-dashed border-gray-400 bg-gray-100 flex items-center justify-center cursor-pointer hover:bg-gray-200 transition" id="drop-zone">
                        <span class="text-xs text-center text-gray-500 pointer-events-none px-2 leading-relaxed">
                            Click or Drop Excel File Here<br>
                            <span class="text-[8px]">(Reads first sheet, first column)</span>
                        </span>
                        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Manual Input / List Display -->
            <div class="pixel-box flex-grow flex flex-col h-80">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg text-green-600">2. OPTIONS LIST</h2>
                    <span id="list-count" class="text-xs bg-black text-white px-2 py-1">0 ITEMS</span>
                </div>
                
                <div class="flex gap-2 mb-4">
                    <input type="text" id="manual-input" placeholder="Add name..." class="pixel-input flex-grow" onkeypress="handleEnter(event)">
                    <button class="pixel-button px-4 py-2 text-xs bg-green-500 text-white" style="text-shadow: 1px 1px 0px #166534;" onclick="addManualEntry()">ADD</button>
                </div>

                <div id="options-list" class="flex-grow border-4 border-black bg-white p-2 overflow-y-auto space-y-2 text-xs">
                    <!-- List items will go here -->
                    <div class="text-center text-gray-400 mt-10">List is empty.</div>
                </div>
                
                <div class="flex justify-between mt-4">
                    <button class="pixel-button px-4 py-2 text-[10px] bg-red-400" onclick="clearList()">CLEAR LIST</button>
                    <button class="pixel-button px-4 py-2 text-[10px] bg-yellow-400 text-black" style="text-shadow: none;" onclick="shuffleList()">SHUFFLE</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Draw Area -->
        <div class="w-full md:w-1/2 flex flex-col gap-6">
            <div class="pixel-box flex-grow flex flex-col justify-center items-center py-12 relative" style="min-height: 400px;">
                
                <h2 class="text-xl mb-8 text-center text-purple-600">3. DRAW A WINNER!</h2>

                <!-- The Slot Machine Display -->
                <div id="result-display" class="pixel-box w-full mb-8 relative border-8 border-black">
                    <div id="result-text" class="slot-item active text-xl md:text-2xl text-center px-4 truncate w-full font-bold">
                        READY...
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="flex flex-col w-full gap-4 px-8">
                    <button id="draw-btn" class="pixel-button py-6 text-xl bg-blue-500 w-full" onclick="startDraw()" disabled>
                        START DRAW!
                    </button>
                    <label class="flex items-center justify-center gap-2 text-xs cursor-pointer mt-2">
                        <input type="checkbox" id="remove-after-draw" class="w-4 h-4 accent-pink-500" checked>
                        <span>Remove winner from list</span>
                    </label>
                </div>

                <!-- Cute Pixel Decoration (Generated via CSS/HTML to avoid external assets) -->
                <div class="absolute -top-6 -right-6 flex">
                    <div class="w-12 h-12 bg-yellow-300 border-4 border-black relative transform rotate-12">
                        <div class="absolute top-2 left-2 w-2 h-2 bg-black"></div>
                        <div class="absolute top-2 right-2 w-2 h-2 bg-black"></div>
                        <div class="absolute bottom-2 left-3 right-3 h-2 bg-black"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div id="msg-modal">
        <div class="pixel-box flex flex-col items-center max-w-sm w-full mx-4">
            <h3 id="msg-title" class="text-xl mb-4 text-red-600">NOTICE</h3>
            <p id="msg-content" class="text-xs leading-relaxed text-center mb-6">Message goes here.</p>
            <button class="pixel-button px-6 py-2 bg-blue-500 text-xs" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        let optionsList = [];
        let isDrawing = false;
        let drawInterval;
        
        // DOM Elements
        const fileInput = document.getElementById('excel-file');
        const dropZone = document.getElementById('drop-zone');
        const listContainer = document.getElementById('options-list');
        const countDisplay = document.getElementById('list-count');
        const drawBtn = document.getElementById('draw-btn');
        const resultDisplay = document.getElementById('result-display');
        const resultText = document.getElementById('result-text');
        
        // Handle File Selection
        fileInput.addEventListener('change', handleFile);
        
        // Drag and Drop support
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-blue-100', 'border-blue-500');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-blue-100', 'border-blue-500');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-100', 'border-blue-500');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile({ target: { files: e.dataTransfer.files } });
            }
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    // Assume data is in the first sheet
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convert to JSON (array of arrays to easily get first column regardless of header)
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                    
                    let newItems = [];
                    // Extract data from the first column of each row
                    json.forEach(row => {
                        if (row && row.length > 0 && row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== '') {
                            newItems.push(String(row[0]).trim());
                        }
                    });

                    if(newItems.length > 0) {
                        // Merge with existing or replace? Let's append.
                        optionsList = [...optionsList, ...newItems];
                        updateListUI();
                        showMessage('SUCCESS', `Loaded ${newItems.length} items from Excel.`);
                    } else {
                        showMessage('ERROR', 'No data found in the first column of the Excel file.');
                    }
                } catch (error) {
                    console.error(error);
                    showMessage('ERROR', 'Failed to read Excel file. Make sure it is a valid .xlsx or .csv file.');
                }
                
                // Reset file input so the same file can be uploaded again if needed
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') addManualEntry();
        }

        function addManualEntry() {
            const input = document.getElementById('manual-input');
            const val = input.value.trim();
            if (val) {
                optionsList.push(val);
                input.value = '';
                updateListUI();
            }
        }

        function removeEntry(index) {
            optionsList.splice(index, 1);
            updateListUI();
        }

        function clearList() {
            if(optionsList.length === 0) return;
            // Custom pixel confirm
            const confirmed = confirm("Are you sure you want to clear the list?");
            if(confirmed) {
                optionsList = [];
                updateListUI();
                resultText.textContent = 'READY...';
                resultText.className = 'slot-item active text-xl md:text-2xl text-center px-4 truncate w-full font-bold';
            }
        }

        function shuffleList() {
            for (let i = optionsList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [optionsList[i], optionsList[j]] = [optionsList[j], optionsList[i]];
            }
            updateListUI();
        }

        function updateListUI() {
            listContainer.innerHTML = '';
            countDisplay.textContent = `${optionsList.length} ITEMS`;
            
            if (optionsList.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-400 mt-10">List is empty.</div>';
                drawBtn.disabled = true;
                return;
            }

            drawBtn.disabled = false;

            optionsList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-gray-50 border-2 border-gray-200 hover:border-black hover:bg-yellow-50';
                
                const span = document.createElement('span');
                span.className = 'truncate pr-2';
                span.textContent = item;
                
                const btn = document.createElement('button');
                btn.className = 'text-red-500 hover:text-red-700 font-bold px-2';
                btn.innerHTML = 'X';
                btn.onclick = () => removeEntry(index);

                div.appendChild(span);
                div.appendChild(btn);
                listContainer.appendChild(div);
            });
            
            // Auto scroll to bottom when adding manually
            listContainer.scrollTop = listContainer.scrollHeight;
        }

        function startDraw() {
            if (optionsList.length === 0 || isDrawing) return;
            
            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.textContent = "DRAWING...";
            drawBtn.classList.remove('bg-blue-500');
            drawBtn.classList.add('bg-gray-400');
            
            resultDisplay.classList.add('animating-slot');
            
            // Rapidly change text to create slot machine effect
            let ticks = 0;
            const maxTicks = 30; // Number of random names to show before stopping
            const speed = 50; // ms per tick
            
            // Ensure resultText has basic slot classes
            resultText.className = 'slot-item active text-xl md:text-xl text-center px-4 truncate w-full';

            drawInterval = setInterval(() => {
                const randomIdx = Math.floor(Math.random() * optionsList.length);
                resultText.textContent = optionsList[randomIdx];
                ticks++;
                
                if (ticks >= maxTicks) {
                    clearInterval(drawInterval);
                    finishDraw();
                }
            }, speed);
        }

        function finishDraw() {
            resultDisplay.classList.remove('animating-slot');
            
            // Pick final winner
            const winnerIndex = Math.floor(Math.random() * optionsList.length);
            const winner = optionsList[winnerIndex];
            
            resultText.textContent = winner;
            resultText.className = 'slot-item active text-2xl md:text-3xl text-center px-4 truncate w-full font-bold text-red-600 bouncing';
            
            shootConfetti();
            
            // Handle removal
            const removeAfter = document.getElementById('remove-after-draw').checked;
            if (removeAfter) {
                optionsList.splice(winnerIndex, 1);
                updateListUI();
            }
            
            // Reset state
            setTimeout(() => {
                isDrawing = false;
                if(optionsList.length > 0) drawBtn.disabled = false;
                drawBtn.textContent = "START DRAW!";
                drawBtn.classList.remove('bg-gray-400');
                drawBtn.classList.add('bg-blue-500');
            }, 1000);
        }

        function shootConfetti() {
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff'];
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Randomize animation properties
                const duration = Math.random() * 2 + 1; // 1 to 3 seconds
                const delay = Math.random() * 0.5;
                conf.style.animationDuration = duration + 's';
                conf.style.animationDelay = delay + 's';
                
                document.body.appendChild(conf);
                
                // Cleanup
                setTimeout(() => {
                    conf.remove();
                }, (duration + delay) * 1000);
            }
        }

        function showMessage(title, content) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-title').className = `text-xl mb-4 ${title === 'ERROR' ? 'text-red-600' : 'text-green-600'}`;
            document.getElementById('msg-content').textContent = content;
            document.getElementById('msg-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('msg-modal').classList.remove('active');
        }
        
        // Initialization
        updateListUI();

    </script>
</body>
</html>
